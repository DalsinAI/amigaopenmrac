<?xml version="1.0" encoding="UTF-8"?>
<!-- OpenMRac's GlowIcon art: a boxy orange saloon seen from behind on an
     asphalt speedway, a concrete wall on its left, trees and a bright sky
     beyond, a chequered flag at the corner. The AmiCradle Team's own
     drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f86d0"/><stop offset="1" stop-color="#cfe3f6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6e74"/><stop offset="1" stop-color="#34343a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a4a"/><stop offset="1" stop-color="#c2410e"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="10" fill="url(#sky)" stroke="#23446e" stroke-width="3"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="34" cy="26" rx="12" ry="5"/><ellipse cx="44" cy="23" rx="9" ry="5"/>
    <ellipse cx="88" cy="32" rx="14" ry="5"/>
  </g>
  <!-- grass and trees -->
  <path d="M8 58 H120 V120 H8z" fill="#6cae3e"/>
  <g fill="#2f7a2a">
    <circle cx="20" cy="54" r="6"/><circle cx="104" cy="52" r="7"/><circle cx="116" cy="55" r="5"/><circle cx="64" cy="54" r="4"/>
  </g>
  <!-- the speedway curving away to the right -->
  <path d="M30 120 C40 90 60 70 120 62 V76 C80 82 70 100 90 120z" fill="url(#road)"/>
  <!-- the concrete wall on its left -->
  <path d="M8 120 L8 104 C30 80 60 64 120 58 V62 C64 70 36 88 26 120z" fill="#c9c3b6" stroke="#8a8478" stroke-width="1.5"/>
  <!-- the car from behind -->
  <g stroke="#3a1606" stroke-width="2" stroke-linejoin="round">
    <rect x="44" y="104" width="10" height="10" rx="2" fill="#1c1c1c"/>
    <rect x="80" y="104" width="10" height="10" rx="2" fill="#1c1c1c"/>
    <path d="M44 84 h46 l4 12 v14 h-54 v-14z" fill="url(#body)"/>
    <path d="M50 84 l4 -10 h26 l4 10z" fill="url(#body)"/>
    <path d="M55 83 l3 -7 h18 l3 7z" fill="#30455a" stroke-width="1.5"/>
    <rect x="44" y="96" width="9" height="5" rx="1" fill="#ff2a2a" stroke-width="1"/>
    <rect x="81" y="96" width="9" height="5" rx="1" fill="#ff2a2a" stroke-width="1"/>
    <rect x="60" y="99" width="14" height="5" rx="1" fill="#f2f2f2" stroke-width="1"/>
  </g>
  <!-- the chequered flag -->
  <g transform="translate(96 84)">
    <rect x="0" y="0" width="2" height="26" fill="#3a3a3a"/>
    <rect x="2" y="0" width="16" height="12" fill="#ffffff" stroke="#222" stroke-width="1"/>
    <g fill="#111">
      <rect x="2" y="0" width="4" height="4"/><rect x="10" y="0" width="4" height="4"/>
      <rect x="6" y="4" width="4" height="4"/><rect x="14" y="4" width="4" height="4"/>
      <rect x="2" y="8" width="4" height="4"/><rect x="10" y="8" width="4" height="4"/>
    </g>
  </g>
</svg>
